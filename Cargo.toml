[workspace]
resolver = "2"
members = ["crates/rom", "crates/n64mem", "crates/oracle", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
racer-rom = { path = "crates/rom" }
n64mem = { path = "crates/n64mem" }
oracle = { path = "crates/oracle" }
sha1 = "0.10"
