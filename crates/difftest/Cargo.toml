[package]
name = "difftest"
version = "0.1.0"
description = "Differential tests: recompiled C (oracle) vs Rust ports (game) on identical RDRAM and registers"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
n64mem.workspace = true
game.workspace = true
oracle.workspace = true
assets.workspace = true

[features]
# Run the difftests against the translate crate's drafts instead of the ports
# (`cargo test -p difftest --features translated`).
translated = ["game/translated"]

[dev-dependencies]
proptest.workspace = true
